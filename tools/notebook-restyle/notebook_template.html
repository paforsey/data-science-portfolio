<!doctype html>
<html lang="en">
<head>
<script type="module" src="/firebase-analytics.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Notebook · {{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
{{CSS}}
</style>
</head>
<body data-restyled="notebook">

<header class="nb-top">
  <div class="nb-top-row">
    <a class="brand" href="/"><span class="brand-mark">PF</span><span class="brand-name">Research Notebook</span></a>
    <nav class="crumbs" aria-label="Breadcrumb">{{CRUMBS}}</nav>
    <a class="btn btn-primary" href="{{BACK_HREF}}">{{BACK_LABEL}}</a>
  </div>
  <div class="nb-toolbar">
    <button type="button" class="tool" id="toggleCode" aria-pressed="false">Hide code</button>
    <span class="tool-sep" aria-hidden="true"></span>
    <span class="chip ok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Executed</span>
    <span class="chip">{{KERNEL}}</span>
    <span class="toolbar-note">Read-only export of the notebook</span>
  </div>
  {{NAVIGATOR}}
</header>

<div class="layout">
  <aside class="toc" aria-label="Notebook sections">
    <p class="rail-title">Contents</p>
    <ol>{{TOC}}</ol>
  </aside>

  <main class="nb-main">
    <header class="nb-header">
      <p class="nb-eyebrow">{{EYEBROW}}</p>
      <h1>{{TITLE}}</h1>
      <p class="nb-subtitle">{{SUBTITLE}}</p>
      <div class="stats">{{STATS}}</div>
      {{NOTICE}}
    </header>
{{BODY}}
  </main>

  <aside class="rail" aria-label="Notebook summary">
    <section>
      <p class="rail-title">Key decisions</p>
      <ol class="decisions">{{DECISIONS}}</ol>
    </section>
    <section>
      <p class="rail-title">Sections read</p>
      <ol class="progress">{{PROGRESS}}</ol>
    </section>
    <section>
      <p class="rail-title">Related</p>
      <ul class="related">{{RELATED}}</ul>
    </section>
  </aside>
</div>

<script>
(function () {
  // Hide code shows only the narrative and outputs.
  var toggle = document.getElementById('toggleCode');
  toggle.addEventListener('click', function () {
    var hidden = document.body.classList.toggle('hide-code');
    toggle.setAttribute('aria-pressed', hidden ? 'true' : 'false');
    toggle.textContent = hidden ? 'Show code' : 'Hide code';
  });

  document.querySelectorAll('.code-card .copy').forEach(function (button) {
    button.addEventListener('click', function () {
      var code = button.parentElement.querySelector('pre').innerText;
      navigator.clipboard.writeText(code).then(function () {
        button.textContent = 'Copied';
        setTimeout(function () { button.textContent = 'Copy'; }, 1500);
      });
    });
  });

  var sections = [].slice.call(document.querySelectorAll('.nb-section'));
  var tocLinks = document.querySelectorAll('[data-toc]');
  var progress = document.querySelectorAll('[data-progress]');
  var navButtons = [].slice.call(document.querySelectorAll('[data-goto]'));

  if (navButtons.length) {
    // One section at a time: the notebook is long, so the navigator swaps sections
    // instead of asking the reader to scroll past every model.
    // A tab owns one section, or a run of them when data-sections lists several.
    var tabs = [].slice.call(document.querySelectorAll('.nav-tab'));
    var owned = tabs.map(function (b) {
      return (b.getAttribute('data-sections') || b.getAttribute('data-goto') || '0')
        .split(',').map(Number);
    });
    var seen = [];
    var showTab = function (tab, scrollToTop) {
      var shown = owned[tab] || [tab];
      sections.forEach(function (s, i) { s.hidden = shown.indexOf(i) === -1; });
      shown.forEach(function (i) { if (seen.indexOf(i) === -1) seen.push(i); });
      tabs.forEach(function (b, t) {
        b.classList.toggle('is-current', t === tab);
        b.setAttribute('aria-current', t === tab ? 'true' : 'false');
      });
      tocLinks.forEach(function (a, i) {
        a.hidden = shown.indexOf(i) === -1;
        a.classList.toggle('is-current', i === shown[0]);
        var subs = a.parentElement.querySelector('.toc-sub');
        if (subs) subs.hidden = shown.indexOf(i) === -1;
      });
      progress.forEach(function (li, i) {
        li.classList.toggle('is-current', shown.indexOf(i) !== -1);
        li.classList.toggle('is-done', shown.indexOf(i) === -1 && seen.indexOf(i) !== -1);
      });
      try { history.replaceState(null, '', '#' + sections[shown[0]].id); } catch (e) {}
      if (scrollToTop) window.scrollTo({ top: 0, behavior: 'instant' });
    };
    // Prev/next buttons address sections; map one back to the tab that owns it.
    var tabOf = function (sectionIndex) {
      for (var t = 0; t < owned.length; t++) if (owned[t].indexOf(sectionIndex) !== -1) return t;
      return 0;
    };
    var showSection = function (index, scrollToTop) { showTab(tabOf(index), scrollToTop); };

    navButtons.forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.preventDefault();
        // Tabs address themselves; prev/next buttons address a section.
        var index = Number(b.getAttribute('data-goto'));
        if (b.classList.contains('nav-tab')) showTab(index, true);
        else showSection(index, true);
      });
    });

    // A link to a heading inside another section opens that section first.
    document.addEventListener('click', function (e) {
      var link = e.target.closest('a[href^="#"]');
      if (!link || link.hasAttribute('data-goto')) return;
      var target = document.getElementById(decodeURIComponent(link.getAttribute('href').slice(1)));
      if (!target) return;
      var owner = target.closest('.nb-section');
      if (owner && owner.hidden) {
        e.preventDefault();
        showSection(sections.indexOf(owner), false);
        target.scrollIntoView();
      }
    });

    // The page opens at the top. A section named in the address opens that tab
    // without the browser jumping down to its heading; a heading inside a section
    // opens the section and goes to the heading.
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    var hashTarget = location.hash ? document.getElementById(decodeURIComponent(location.hash.slice(1))) : null;
    var hashOwner = hashTarget && sections.indexOf(hashTarget) === -1 ? hashTarget.closest('.nb-section') : null;
    showSection(hashOwner ? sections.indexOf(hashOwner) : Math.max(sections.indexOf(hashTarget), 0), false);
    var land = function () {
      if (hashOwner) hashTarget.scrollIntoView();
      else window.scrollTo({ top: 0, behavior: 'instant' });
    };
    land();
    // The browser scrolls to the address fragment again once the page loads;
    // land again then, unless the reader has already started moving.
    var moved = false;
    var markMoved = function () { moved = true; };
    ['wheel', 'touchstart', 'keydown'].forEach(function (t) { window.addEventListener(t, markMoved, { once: true, passive: true }); });
    window.addEventListener('load', function () { if (!moved) land(); });
  } else {
    // Every section on one page: highlight whichever one the reader has reached.
    var update = function () {
      var line = window.innerHeight * 0.35, current = 0;
      sections.forEach(function (s, i) { if (s.getBoundingClientRect().top < line) current = i; });
      var atEnd = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4;
      if (atEnd) current = sections.length - 1;
      tocLinks.forEach(function (a, i) { a.classList.toggle('is-current', i === current); });
      progress.forEach(function (li, i) {
        li.classList.toggle('is-done', i < current || atEnd);
        li.classList.toggle('is-current', i === current && !atEnd);
      });
    };
    window.addEventListener('scroll', update, { passive: true });
    update();
  }
})();
</script>

</body>
</html>
